name: CI/CD - AKS MLOps Platform

on:
  push:
    branches: [develop]

  pull_request:
    branches: [develop, master]

  workflow_dispatch:

env:
  IMAGE_NAME: credit-risk-api
  STREAMLIT_IMAGE_NAME: credit-risk-streamlit
  MLFLOW_IMAGE_NAME: mlflow
  ACR_LOGIN_SERVER: creditriskacrguetch.azurecr.io
  RESOURCE_GROUP: credit-risk-scoring
  AKS_CLUSTER: aks-mlops

jobs:
  ci-k8s:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: |
          python src/train.py

      - name: Evaluate model
        run: |
          python src/evaluate.py

      - name: Generate SHAP report
        run: |
          python src/explain.py

      - name: Run tests
        run: |
          export PYTHONPATH=$PWD
          pytest tests/

      - name: Upload model and reports
        uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            models/
            reports/

  deploy:
    needs: ci-k8s
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $RESOURCE_GROUP \
            --name $AKS_CLUSTER \
            --overwrite-existing

      - name: Login ACR
        run: az acr login --name creditriskacrguetch

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-and-reports
          path: .

      - name: Check downloaded files
        run: |
          ls -lah
          ls -lah models || true
          ls -lah reports || true

      - name: Build & Push API
        run: |
          docker build -f Dockerfile.api \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG .

          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
          docker tag $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG $ACR_LOGIN_SERVER/$IMAGE_NAME:latest
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

      - name: Build & Push Streamlit
        run: |
          docker build -f Dockerfile.streamlit \
            -t $ACR_LOGIN_SERVER/$STREAMLIT_IMAGE_NAME:$IMAGE_TAG .

          docker push $ACR_LOGIN_SERVER/$STREAMLIT_IMAGE_NAME:$IMAGE_TAG
          docker tag $ACR_LOGIN_SERVER/$STREAMLIT_IMAGE_NAME:$IMAGE_TAG $ACR_LOGIN_SERVER/$STREAMLIT_IMAGE_NAME:latest
          docker push $ACR_LOGIN_SERVER/$STREAMLIT_IMAGE_NAME:latest


      - name: Build & Push MLflow
        run: |
          docker build -f Dockerfile.mlflow \
            -t $ACR_LOGIN_SERVER/$MLFLOW_IMAGE_NAME:$IMAGE_TAG .

          docker push $ACR_LOGIN_SERVER/$MLFLOW_IMAGE_NAME:$IMAGE_TAG
          docker tag $ACR_LOGIN_SERVER/$MLFLOW_IMAGE_NAME:$IMAGE_TAG $ACR_LOGIN_SERVER/$MLFLOW_IMAGE_NAME:latest
          docker push $ACR_LOGIN_SERVER/$MLFLOW_IMAGE_NAME:latest

      - name: Deploy API
        run: |
          sed "s|IMAGE_PLACEHOLDER|$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG|g" k8s/api-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/api-service.yaml
          kubectl rollout status deployment/credit-risk-api --timeout=300s

      - name: Deploy Streamlit
        run: |
          sed "s|STREAMLIT_IMAGE_PLACEHOLDER|$ACR_LOGIN_SERVER/$STREAMLIT_IMAGE_NAME:$IMAGE_TAG|g" k8s/streamlit-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/streamlit-service.yaml
          kubectl rollout status deployment/credit-risk-streamlit --timeout=300s

      - name: Deploy MLflow
        run: |
          sed "s|IMAGE_PLACEHOLDER|$ACR_LOGIN_SERVER/$MLFLOW_IMAGE_NAME:$IMAGE_TAG|g" k8s/mlflow-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/mlflow-service.yaml
          kubectl rollout status deployment/mlflow-server --timeout=300s

      - name: Test API
        run: |
          pkill -f "kubectl port-forward" || true
          kubectl port-forward service/credit-risk-service 8000:80 --address 127.0.0.1 &
          sleep 15
          curl -f http://127.0.0.1:8000/health


      - name: Debug Kubernetes on failure
        if: failure()
        run: |
          hostname
          whoami
          docker ps
          kubectl get pods
          kubectl describe deployment credit-risk-api
          kubectl get events --sort-by=.metadata.creationTimestamp | tail -40
          kubectl get svc credit-risk-service -o yaml
          kubectl get endpoints credit-risk-service
          kubectl get ingress || true